# Logbook in production on a Linux server (Debian, Ubuntu) with Docker
# Compose: one image, three services, the `updater` for automatic updates, and
# the PostgreSQL 18 in DATABASE_URL. Settings live in .env next to this file:
#
#   cp .env.example .env    # then set the production values, see docs/configuration.md
#   docker compose up -d --pull always
#
# LOGBOOK_VERSION in .env selects the release of ghcr.io/meldgrove/logbook:
# a version such as 0.2.0, or a series such as 0.2. With automatic updates
# (docs/deployment.md), the server writes each version it installs there, and
# admins see new versions in Logbook's update button.
#
# Without a PostgreSQL of your own, add compose.postgres.yaml: it runs one
# next to Logbook (docs/deployment.md).
#
# `web` listens on 127.0.0.1:3000 (LOGBOOK_PORT changes the host port), for a
# reverse proxy on the same server, such as Caddy, that terminates HTTPS; set
# LOGBOOK_BASE_URL to its public URL. `migrate` runs once before `web` and
# `worker` start. Back up the database. The branch `stable` is at the newest
# release; `main` has unreleased changes. On Coolify, use
# compose.coolify.yaml (docs/coolify.md). Local development uses
# compose.dev.yaml.

# LOGBUCH_VERSION of an older .env stands in for LOGBOOK_VERSION. Without
# either, the tag is the text after :- below, which no image can have:
# Compose stops with "unable to get image ...: invalid reference format"
# before it starts anything. No :? inside: Docker Compose 2.x would then
# require the old name even next to the new.
x-image: &image ghcr.io/meldgrove/logbook:${LOGBOOK_VERSION:-${LOGBUCH_VERSION:-set LOGBOOK_VERSION in .env to a release, e.g. 0.2.0}}

x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:?}
  # Signs sessions (web) and seals the secrets of Admin › Integrations (every
  # process, also `cli` in `migrate`).
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
  TZ: ${TZ:-UTC}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # The update button and the Updates card on the admin page ask `updater`,
  # with UPDATER_TOKEN (recommended; openssl rand -hex 32), which the updater
  # then requires.
  UPDATER_URL: ${UPDATER_URL:-http://updater:8080}
  UPDATER_TOKEN: ${UPDATER_TOKEN:-}

x-directory-environment: &directory-environment
  # LOGBUCH_BASE_URL of an older .env stands in. Without either, web and
  # worker do not start and name LOGBOOK_BASE_URL.
  LOGBOOK_BASE_URL: ${LOGBOOK_BASE_URL:-${LOGBUCH_BASE_URL:-}}
  OIDC_ISSUER: ${OIDC_ISSUER:?}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?}
  DIRECTORY: ${DIRECTORY:-manual}
  INITIAL_ADMIN_EMAILS: ${INITIAL_ADMIN_EMAILS:-}
  KEYCLOAK_ACCESS_GROUP: ${KEYCLOAK_ACCESS_GROUP:-}
  KEYCLOAK_ADMIN_GROUP: ${KEYCLOAK_ADMIN_GROUP:-}
  KEYCLOAK_TEAMS_GROUP: ${KEYCLOAK_TEAMS_GROUP:-}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}

# Error reporting to Sentry; off without SENTRY_DSN.
x-error-reporting-environment: &error-reporting-environment
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}

services:
  migrate:
    image: *image
    command: ["migrate"]
    restart: "no"
    environment:
      <<: *app-environment

  web:
    image: *image
    command: ["web"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      # Only on the server itself, for the reverse proxy. LOGBOOK_PORT picks
      # another host port when 3000 is taken, e.g. by another app.
      - "127.0.0.1:${LOGBOOK_PORT:-3000}:3000"
    environment:
      <<: [*app-environment, *directory-environment, *error-reporting-environment]
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_TRUST_EMAIL: ${OIDC_TRUST_EMAIL:-}
    healthcheck:
      # Readiness: database reachable and migrations applied.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/-/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: *image
    command: ["worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: [*app-environment, *directory-environment, *error-reporting-environment]
      # Slack, email, and the webhook are set under Admin › Integrations, or
      # with `cli settings` (docs/deployment.md). Earlier versions read these
      # eight from .env: the worker copies them there once and ignores them
      # afterwards. They stay here for servers that start this file before the
      # copy. Admin › Integrations and `cli settings list` name the ones still
      # set in .env: delete them there.
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID:-}
      SMTP_URL: ${SMTP_URL:-}
      MAILERSEND_API_TOKEN: ${MAILERSEND_API_TOKEN:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    healthcheck:
      # The worker refreshes its heartbeat file every 30 seconds.
      test: ["CMD", "node", "dist/worker-healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Automatic updates and the update button (docs/deployment.md). It checks
  # for new versions; it installs them once the server runs `updater
  # host-setup`: then admins choose Stable or Preview in Logbook, and for each
  # installation the server writes the version into LOGBOOK_VERSION, pulls it,
  # runs `docker compose up --wait`, and goes back to the version before when
  # it does not become healthy. No ports: only `web` calls its API. With
  # UPDATER_TOKEN, the API takes only requests that carry it.
  updater:
    image: ghcr.io/meldgrove/updater:0.2
    restart: unless-stopped
    environment:
      IMAGE: *image
      VERSION_VARIABLE: LOGBOOK_VERSION
      API_TOKEN: ${UPDATER_TOKEN:-}
      # A release installs once it has been out this long, and only inside
      # the window, if one is set (e.g. 02:00-05:00, in the time zone TZ).
      COOLDOWN: ${UPDATE_COOLDOWN:-3d}
      WINDOW: ${UPDATE_WINDOW:-}
      TZ: ${TZ:-UTC}
      REGISTRY_USERNAME: ${UPDATE_REGISTRY_USERNAME:-}
      REGISTRY_PASSWORD: ${UPDATE_REGISTRY_PASSWORD:-}
    volumes:
      - updater:/trigger

  # Backups for Meldgrove Backups (docs/deployment.md#backups): the database,
  # sent when Backups asks. Idle while BACKUP_URL is empty; it only reads and
  # opens no port.
  backup-agent:
    image: ghcr.io/meldgrove/backup-agent:0.1
    restart: unless-stopped
    # The app's user, so that the agent reads every file the app writes.
    user: "1000:1000"
    environment:
      # From the app's source in Meldgrove Backups. Empty: the agent idles.
      BACKUP_URL: ${BACKUP_URL:-}
      BACKUP_TOKEN: ${BACKUP_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:?}
      APP_NAME: logbook
      APP_IMAGE: *image
      # Settings a restore needs that are not in the backup (names only).
      APP_SECRETS: BETTER_AUTH_SECRET

volumes:
  # The updater's state and its requests to the server (Debian, docs/deployment.md).
  updater:
