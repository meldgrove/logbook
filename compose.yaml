# Logbook in production: one image, three services, and the PostgreSQL 18 in
# DATABASE_URL.
#
#   cp .env.example .env    # then set the production values, see docs/configuration.md
#   docker compose up -d
#
# LOGBOOK_VERSION in .env selects the release of ghcr.io/meldgrove/logbook,
# e.g. 0.2.0. `updater` installs new versions and, on a Debian server, writes
# each into LOGBOOK_VERSION; admins see them in Logbook's update button
# (docs/deployment.md, Automatic updates). On a platform, the tag set there
# decides (0.2, latest, preview). On a platform that does not pull images
# when it deploys, PULL_POLICY=always makes every start pull them again.
#
# Without a PostgreSQL of your own, add compose.postgres.yaml: it runs one
# next to Logbook (docs/deployment.md).
#
# Put a TLS-terminating reverse proxy in front of `web` (port 3000) and set
# LOGBOOK_BASE_URL to its public URL. `migrate` runs once before `web` and
# `worker` start. Platforms that run Compose files can use this file as it
# is; set the variables in their environment view. A platform that reads the
# file from the repository follows the branch `stable`, which is at the
# newest release; `main` has unreleased changes.
# Local development uses compose.dev.yaml.

x-image: &image ghcr.io/meldgrove/logbook:${LOGBOOK_VERSION:-${LOGBUCH_VERSION:?set LOGBOOK_VERSION in .env to a release, e.g. 0.2.0}}

x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:?}
  TZ: ${TZ:-UTC}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # The update button and the Updates card on the admin page ask `updater`.
  UPDATER_URL: ${UPDATER_URL:-http://updater:8080}

x-directory-environment: &directory-environment
  LOGBOOK_BASE_URL: ${LOGBOOK_BASE_URL:-${LOGBUCH_BASE_URL:?set LOGBOOK_BASE_URL to the public URL}}
  OIDC_ISSUER: ${OIDC_ISSUER:?}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?}
  DIRECTORY: ${DIRECTORY:-manual}
  INITIAL_ADMIN_EMAILS: ${INITIAL_ADMIN_EMAILS:-}
  KEYCLOAK_ACCESS_GROUP: ${KEYCLOAK_ACCESS_GROUP:-}
  KEYCLOAK_ADMIN_GROUP: ${KEYCLOAK_ADMIN_GROUP:-}
  KEYCLOAK_TEAMS_GROUP: ${KEYCLOAK_TEAMS_GROUP:-}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}

# Error reporting to Sentry; off without SENTRY_DSN.
x-error-reporting-environment: &error-reporting-environment
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}

services:
  migrate:
    image: *image
    pull_policy: ${PULL_POLICY:-missing}
    command: ["migrate"]
    restart: "no"
    environment:
      <<: *app-environment

  web:
    image: *image
    pull_policy: ${PULL_POLICY:-missing}
    command: ["web"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      <<: [*app-environment, *directory-environment, *error-reporting-environment]
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_TRUST_EMAIL: ${OIDC_TRUST_EMAIL:-}
    healthcheck:
      # Readiness: database reachable and migrations applied.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/-/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: *image
    pull_policy: ${PULL_POLICY:-missing}
    command: ["worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: [*app-environment, *directory-environment, *error-reporting-environment]
      # Each channel is off until it is configured.
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID:-}
      SMTP_URL: ${SMTP_URL:-}
      MAILERSEND_API_TOKEN: ${MAILERSEND_API_TOKEN:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    healthcheck:
      # The worker refreshes its heartbeat file every 30 seconds.
      test: ["CMD", "node", "dist/worker-healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Automatic updates and the update button (docs/deployment.md). It checks
  # for new versions; it installs them once UPDATE_DEPLOY_HOOK_URL is set
  # (Coolify) or the server watches the volume `updater` (Debian: `updater
  # host-setup`): it calls that deploy link, or the server pins the version
  # in LOGBOOK_VERSION, pulls it, and starts it. No ports: its API has no
  # authentication, and only `web` calls it.
  updater:
    image: ghcr.io/meldgrove/updater:0.2
    pull_policy: ${PULL_POLICY:-missing}
    restart: unless-stopped
    environment:
      IMAGE: *image
      VERSION_VARIABLE: LOGBOOK_VERSION
      DEPLOY_HOOK_URL: ${UPDATE_DEPLOY_HOOK_URL:-}
      DEPLOY_HOOK_TOKEN: ${UPDATE_DEPLOY_HOOK_TOKEN:-}
      # A release installs once it has been out this long, and only inside
      # the window, if one is set (e.g. 02:00-05:00, in the time zone TZ).
      COOLDOWN: ${UPDATE_COOLDOWN:-3d}
      WINDOW: ${UPDATE_WINDOW:-}
      TZ: ${TZ:-UTC}
      REGISTRY_USERNAME: ${UPDATE_REGISTRY_USERNAME:-}
      REGISTRY_PASSWORD: ${UPDATE_REGISTRY_PASSWORD:-}
    volumes:
      - updater:/trigger

volumes:
  # The updater's state and its requests to the server (Debian, docs/deployment.md).
  updater:
