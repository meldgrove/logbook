name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.13.0"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, types, unit tests, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Migrations match the schema
        run: |
          npx drizzle-kit generate --name ci-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            git status --porcelain drizzle
            echo "src/lib/db/schema.ts has changes without a migration. Run: npm run db:generate"
            exit 1
          fi
      - run: npm run build
      # Moderate findings are excluded: the only ones today come from
      # drizzle-kit (a Better Auth peer dependency) and affect esbuild's dev
      # server, which never runs in production.
      - run: npm audit --omit=dev --audit-level=high

  integration:
    name: Integration tests (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: logbook
          POSTGRES_PASSWORD: logbook
          POSTGRES_DB: logbook
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U logbook -d logbook"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://logbook:logbook@localhost:5432/logbook_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:integration

  e2e:
    name: End-to-end tests (Keycloak, PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: logbook
          POSTGRES_PASSWORD: logbook
          POSTGRES_DB: logbook
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U logbook -d logbook"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Start Keycloak with the development realm
        run: |
          docker run -d --name keycloak -p 8090:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$PWD/dev/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.8.2-3 start-dev --import-realm --http-port=8080
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Wait for Keycloak
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://localhost:8090/realms/logbook/.well-known/openid-configuration > /dev/null && exit 0
            sleep 2
          done
          docker logs keycloak | tail -50
          exit 1
      - name: Start Logbook (web and worker)
        run: |
          set -a; source .env.example; set +a
          # Production refuses the example secret.
          export BETTER_AUTH_SECRET="$(openssl rand -base64 32)"
          export NODE_ENV=production TZ=Europe/Amsterdam PORT=3000 HOSTNAME=127.0.0.1 WORKER_HEARTBEAT_FILE="$RUNNER_TEMP/heartbeat"
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          LOGBOOK_PROCESS=migrate node dist/migrate.mjs
          LOGBOOK_PROCESS=web nohup node .next/standalone/server.js > "$RUNNER_TEMP/web.log" 2>&1 &
          LOGBOOK_PROCESS=worker nohup node dist/worker.mjs > "$RUNNER_TEMP/worker.log" 2>&1 &
          # A second instance with the manual directory and its own database.
          PGPASSWORD=logbook psql -h localhost -p 55432 -U logbook -d logbook -c "create database logbook_manual"
          export DATABASE_URL=postgres://logbook:logbook@localhost:55432/logbook_manual
          export DIRECTORY=manual INITIAL_ADMIN_EMAILS=adam@example.test LOGBOOK_BASE_URL=http://localhost:3001 PORT=3001
          LOGBOOK_PROCESS=migrate node dist/migrate.mjs
          LOGBOOK_PROCESS=web nohup node .next/standalone/server.js > "$RUNNER_TEMP/web-manual.log" 2>&1 &
      - name: Wait for Logbook
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:3000/-/readyz > /dev/null && curl -fsS http://127.0.0.1:3001/-/readyz > /dev/null && exit 0
            sleep 2
          done
          echo "Logbook did not become ready"
          cat "$RUNNER_TEMP/web.log" "$RUNNER_TEMP/worker.log" "$RUNNER_TEMP/web-manual.log"
          exit 1
      - run: npm run test:e2e
        env:
          CI: "true"
          # The proposal tests move deadlines into the past in the app's database.
          DATABASE_URL: postgres://logbook:logbook@localhost:55432/logbook
      - name: Logs
        if: failure()
        run: cat "$RUNNER_TEMP/web.log" "$RUNNER_TEMP/worker.log" "$RUNNER_TEMP/web-manual.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: logbook
          POSTGRES_PASSWORD: logbook
          POSTGRES_DB: logbook
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U logbook -d logbook"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Docker Compose 2.x (this runner's) checks a :? inside a fallback even
      # when the variable before it is set. A new server's .env has only the
      # new names; one from before the rename may have only LOGBUCH_*.
      - name: The compose files take only the new or only the old names
        run: |
          docker compose version
          shared=(POSTGRES_PASSWORD=ci-only DATABASE_URL=postgres://logbook:ci-only@postgres:5432/logbook
            BETTER_AUTH_SECRET=ci-only OIDC_ISSUER=https://sso.example.invalid/realms/logbook
            OIDC_CLIENT_ID=logbook OIDC_CLIENT_SECRET=ci-only INITIAL_ADMIN_EMAILS=admin@example.invalid)
          printf '%s\n' "${shared[@]}" LOGBOOK_VERSION=0.3 LOGBOOK_BASE_URL=https://logbook.example.invalid >"$RUNNER_TEMP/new.env"
          printf '%s\n' "${shared[@]}" LOGBUCH_VERSION=0.3 LOGBUCH_BASE_URL=https://logbook.example.invalid >"$RUNNER_TEMP/old.env"
          printf '%s\n' "${shared[@]}" LOGBOOK_BASE_URL=https://logbook.example.invalid >"$RUNNER_TEMP/no-version.env"
          for names in new old; do
            echo "Only the $names names"
            for files in "-f compose.yaml -f compose.postgres.yaml" "-f compose.coolify.yaml"; do
              # shellcheck disable=SC2086 # the -f options
              docker compose --env-file "$RUNNER_TEMP/$names.env" $files config --format json |
                jq -e '.services.web | .image == "ghcr.io/meldgrove/logbook:0.3" and .environment.LOGBOOK_BASE_URL == "https://logbook.example.invalid"'
            done
          done
          # Without a version, the tag is the hint, which no image can have:
          # Compose refuses it before it pulls the image.
          for files in "-f compose.yaml" "-f compose.coolify.yaml"; do
            # shellcheck disable=SC2086 # two words: the option and the file
            if output=$(docker compose --env-file "$RUNNER_TEMP/no-version.env" $files pull migrate 2>&1); then
              echo "Compose pulled an image without LOGBOOK_VERSION"
              exit 1
            fi
            echo "$output"
            grep -q "logbook:set LOGBOOK_VERSION in .env to a release.*invalid reference format" <<<"$output"
          done
      - run: docker build -t logbook:ci .
      - name: The image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id logbook:ci -u)" = "1000"
      - name: The operator command runs in the image, also from the PATH
        run: |
          env_args=(-e DATABASE_URL=postgres://logbook:logbook@localhost:5432/logbook -e BETTER_AUTH_SECRET="$(openssl rand -base64 32)")
          docker run --rm --network host "${env_args[@]}" logbook:ci migrate
          docker run --rm --network host "${env_args[@]}" logbook:ci cli help | grep -q "cli settings list"
          # `cli` is on the PATH too (docker compose exec web cli …).
          docker run --rm --network host "${env_args[@]}" --entrypoint cli logbook:ci settings list | grep -Eq '^slack +not set'

  # The updater installs images, not files: each new image must start with the
  # compose files of the newest release (branch `stable`).
  compose-compat:
    name: Compose files of the newest release
    permissions:
      contents: read
    uses: meldgrove/.github/.github/workflows/compose-compat.yml@be24d5a706d2e266492e3e910a23cde3d04aef36 # v1.2.1
    with:
      version_variable: LOGBOOK_VERSION
      env_file: .github/compose-compat.env
